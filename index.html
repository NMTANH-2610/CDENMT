<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CDE</title>
<link rel="icon" href="data:,">
<style>
:root{--g:#12945F;--gs:#DDF3E8;--ink:#16272E;--mut:#66777F;--line:#E2E8E5;--bg:#F4F7F5;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px}
.brand b{display:block;line-height:1.25;word-break:break-word}.brand small{color:var(--mut);font-size:.75rem}
.logo{flex:none;width:38px;height:38px;border-radius:10px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.1rem}
#nav{display:flex;flex-direction:column;gap:4px}
.nv{display:flex;gap:10px;align-items:center;padding:10px 12px;border:0;border-radius:10px;background:none;cursor:pointer;text-align:left;white-space:nowrap}
.nv:hover{background:var(--bg)}.nv[aria-current="true"]{background:var(--gs);color:var(--g);font-weight:600}
main{padding:24px clamp(16px,3vw,32px) 48px;min-width:0}
h1{margin:0;font-size:1.4rem}
.hd{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:16px}
select,main input:not([type=file]){padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);min-width:0}
.sec{display:flex;align-items:center;gap:10px;font-size:1.05rem;margin:20px 0 12px}
.sec::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--g)}
.g3,.g2,.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr;margin-top:16px}
.grid{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card.flush{padding:0;overflow:hidden}.card h3{margin:0 0 10px;font-size:1rem}
.big{font-size:1.6rem;font-weight:700}.mut{color:var(--mut);font-size:.85rem}
.meter{height:12px;border-radius:6px;background:var(--gs);overflow:hidden;margin:12px 0}.meter i{display:block;height:100%;background:var(--g)}
.kv{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ls{list-style:none;margin:0;padding:0}.ls li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ls li:first-child{border-top:0}.ls li>span{flex:1;min-width:0;word-break:break-word}
.chk{flex:none;width:20px;height:20px;border:2px solid var(--g);border-radius:50%;background:none;cursor:pointer}.chk:hover{background:var(--gs)}
.btn{display:inline-block;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-weight:500;font-size:.85rem;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--g);color:var(--g)}
.btn.pri{background:var(--g);border-color:var(--g);color:#fff;padding:8px 16px}.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.inl{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}.inl input{flex:1 1 220px}.inl .sm{flex:0 1 150px}
.add{display:flex;gap:8px;margin-top:10px}.add input{flex:1}
.empty{padding:28px 16px;text-align:center;color:var(--mut)}
.lnk{border:0;background:none;color:var(--g);cursor:pointer;text-decoration:underline;padding:0}
.drop{text-align:center;border:2px dashed var(--line);margin-bottom:16px}.drop.over{border-color:var(--g);background:var(--gs)}
.drop p{margin:0 0 10px;color:var(--mut)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:12px;overflow:hidden;display:none}.bar i{display:block;height:100%;width:0;background:var(--g)}
#msg{margin-top:8px;font-size:.85rem;color:var(--mut)}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-bottom:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);border-radius:99px;background:var(--card);padding:5px 12px;cursor:pointer;font-size:.85rem}.tab span{color:var(--mut);margin-left:4px}
.tab[aria-pressed="true"]{background:var(--gs);border-color:var(--g);color:var(--g);font-weight:600}
.scroll{overflow-x:auto}
.row{display:grid;grid-template-columns:22px 30px minmax(100px,3fr) 34px 104px 108px 34px 72px 70px 210px;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);min-width:876px}
.row>.acts{position:sticky;right:0;z-index:1;justify-self:end;margin-right:-10px;padding:4px 10px 4px 8px;background:var(--card)}   /* nút thao tác luôn nằm sát mép phải khi bảng phải cuộn ngang */
.row.head{border-top:0;color:var(--mut);font-size:.8rem;padding-block:10px;background:var(--bg)}
.nm{font-weight:500;word-break:break-all}
details summary{cursor:pointer;color:var(--mut);font-size:.8rem}details a{display:block;font-size:.8rem;color:var(--g);padding:2px 0}
.acts{display:flex;gap:6px}
.pill{font-style:normal;display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--b);color:var(--f)}
.s-wip{--b:#F6E6C8;--f:#8A5200}.s-shared{--b:#D6E8F7;--f:#1F5E96}.s-published{--b:#D4EFE2;--f:#0B6B46}.s-archive{--b:#E4E8E7;--f:#4F5B63}
.toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.side{position:static;height:auto;min-width:0}#nav{flex-direction:row;overflow-x:auto}.g3,.g2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.crumb{margin-top:2px;font-size:.9rem}.crumb .lnk{text-decoration:none;font-weight:500}
.tb{display:flex;gap:8px;flex-wrap:wrap}
.fd{display:flex;gap:8px;align-items:center;border:0;background:none;cursor:pointer;font-weight:500;padding:0;text-align:left;word-break:break-all}.fd:hover{color:var(--g)}
/* ---- Thanh tab, cây thư mục, thanh công cụ ---- */
main input[type=checkbox]{width:18px;height:18px;min-width:0;margin:0;padding:0;border:0;background:none;accent-color:var(--g);cursor:pointer}
.bc{font-size:.78rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--mut)}.bc b{color:var(--ink)}
.bc .lnk{font:inherit;color:var(--mut);text-decoration:none}.bc .lnk:hover{color:var(--g)}
.ptabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.pt{flex:none;display:flex;gap:8px;align-items:center;padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--mut);cursor:pointer;white-space:nowrap}
.pt:hover{color:var(--g);border-color:var(--g)}
.pt[aria-selected="true"]{background:var(--gs);border-color:#B9E3CD;color:var(--g);font-weight:600}
.pt.soon{opacity:.5}.pt.soon:hover{color:var(--mut);border-color:var(--line)}
.split{display:grid;grid-template-columns:210px minmax(0,1fr);gap:16px;align-items:start}
.split.off{grid-template-columns:minmax(0,1fr)}.split.off .ftree{display:none}
.pane{min-width:0}
.ftree{position:sticky;top:16px;padding:12px;max-height:calc(100vh - 32px);overflow:auto}
.ftree h3{margin:0 4px 6px;font-size:.75rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}.ftree h3.t2{margin-top:18px}
.ti{display:flex;gap:8px;align-items:center;width:100%;padding:8px 10px;border:0;border-radius:8px;background:none;cursor:pointer;text-align:left}
.ti svg{flex:none}.ti span{flex:1;min-width:0;word-break:break-word}.ti small{color:var(--mut)}
.ti:hover{background:var(--bg)}.ti[aria-pressed="true"]{background:var(--gs);color:var(--g);font-weight:600}
.pcrumb{display:flex;align-items:center;gap:10px;margin-bottom:12px}.pcrumb .crumb{flex:1;min-width:0;margin:0}
.sbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.sq{flex:1 1 260px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--mut)}
.sq:focus-within{border-color:var(--g);box-shadow:0 0 0 2px var(--gs)}
.sq input:not([type=file]){flex:1;padding:9px 0;border:0;border-radius:0;background:none;outline:none}
.ibs{display:flex;align-items:center;gap:2px}.sep{width:1px;height:20px;margin:0 6px;background:var(--line)}
.ib{display:inline-grid;place-items:center;flex:none;width:34px;height:34px;padding:0;border:0;border-radius:8px;background:none;color:var(--ink);cursor:pointer;text-decoration:none}
.ib:hover:not(:disabled){background:var(--gs);color:var(--g)}.ib:disabled{opacity:.35;cursor:not-allowed}
.flag{color:var(--mut)}.flag.on{color:#C98F00}.flag.on svg{fill:#E9B949}
.lk{color:var(--mut)}.lk.on{color:#B45309}
.mn{position:relative}.pop{display:none;position:absolute;right:0;top:38px;z-index:5;min-width:240px;white-space:nowrap;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(22,39,46,.14)}
.mn.open .pop{display:block}.pop button{display:block;width:100%;padding:8px 10px;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer}.pop button:hover{background:var(--gs);color:var(--g)}
.btn svg{vertical-align:-3px}
.g4{display:grid;gap:16px;grid-template-columns:repeat(4,1fr)}
button.stat{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;cursor:pointer;font:inherit;color:inherit}.stat:hover{border-color:var(--g)}
.chk.done{background:var(--g)}
@media(max-width:900px){.split{grid-template-columns:minmax(0,1fr)}.ftree{position:static;max-height:none}.g4{grid-template-columns:1fr 1fr}}
/* ---- Menu chuột phải + hộp thoại ---- */
.ctx{position:fixed;z-index:30;display:none;min-width:230px;max-width:300px;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(22,39,46,.18)}
.ctx.on{display:block}
.ctx .ct{padding:6px 10px 6px;font-size:.75rem;font-weight:600;letter-spacing:.03em;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx button{display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border:0;border-radius:6px;background:none;text-align:left;cursor:pointer;white-space:nowrap}
.ctx button svg{flex:none}.ctx button:hover,.ctx button:focus-visible{background:var(--gs);color:var(--g);outline:0}
.ctx button.dng{color:#B42318}.ctx button.dng:hover,.ctx button.dng:focus-visible{background:#FDECEA;color:#B42318}
.ctx hr{border:0;border-top:1px solid var(--line);margin:6px 4px}
.ib.del:hover:not(:disabled){background:#FDECEA;color:#B42318}
dialog{border:0;border-radius:14px;padding:20px;width:min(420px,calc(100vw - 32px));background:var(--card);color:var(--ink);box-shadow:0 16px 48px rgba(22,39,46,.3)}
dialog::backdrop{background:rgba(22,39,46,.4)}
dialog h3{margin:0 0 8px;font-size:1.05rem;word-break:break-word}dialog p{margin:0 0 14px;color:var(--mut);font-size:.9rem}
dialog input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-bottom:14px}
.dact{display:flex;gap:8px;justify-content:flex-end}
.btn.dng{background:#C0362C;border-color:#C0362C;color:#fff;padding:8px 16px}.btn.dng:hover{color:#fff;border-color:#C0362C;filter:brightness(1.08)}
.btn.del{color:#C0362C}.btn.del:hover{border-color:#C0362C;color:#C0362C;background:#FBEDEB}
</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <div class="brand"><span class="logo" id="lg">C</span><div><b id="co"></b><small>Kho dữ liệu dự án</small></div></div>
  <nav id="nav" aria-label="Menu chính"></nav>
 </aside>
 <main id="main"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="ctx" id="ctx" role="menu"></div>
<dialog id="dlg"><form method="dialog"><h3 id="dlgt"></h3><p id="dlgp"></p><input id="dlgin" autocomplete="off" maxlength="120" aria-label="Nhập tên"><div class="dact"><button type="button" class="btn" id="dlgno" onclick="this.closest('dialog').close('no')">Hủy</button><button type="submit" value="ok" class="btn pri" id="dlgok">Đồng ý</button></div></form></dialog>

<script>
const ST=[{id:'wip',n:'Đang thực hiện',a:'Chia sẻ',x:'shared'},{id:'shared',n:'Đã chia sẻ',a:'Công bố',x:'published'},
 {id:'published',n:'Đã công bố',a:'Lưu trữ',x:'archive'},{id:'archive',n:'Lưu trữ',a:'Khôi phục',x:'wip'}];
const DONE={shared:'Đã chia sẻ',published:'Đã công bố',archive:'Đã lưu trữ',wip:'Đã khôi phục'};
const NAV=[['home','Trang chủ','<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>'],
 ['projects','Dự án','<path d="M12 2l10 5-10 5L2 7zM2 17l10 5 10-5M2 12l10 5 10-5"/>'],
 ['data','Dữ liệu chung','<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>'],
 ['settings','Cài đặt','<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>']];
let db={settings:{},projects:{},docs:{},folders:[],tasks:[],log:[]},quota=0,free=null,dir='',view='home',proj='',cwd='',stage='all',q='',busy=false,last='',ptab='files',treeOff=false,upDir=null,ctxT=null;
const sel=new Set();                                   // các tệp đang tick chọn
let flags=new Set();try{flags=new Set(JSON.parse(localStorage.getItem('cde.flags')||'[]'))}catch(e){}   // tệp đánh dấu (lưu riêng trên trình duyệt này)
const saveFlags=()=>{try{localStorage.setItem('cde.flags',JSON.stringify([...flags]))}catch(e){}};
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sz=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':b<1099511627776?(b/1073741824).toFixed(2)+' GB':(b/1099511627776).toFixed(2)+' TB';
const dd=s=>s?new Date(s).toLocaleDateString('vi-VN',{dateStyle:'short'}):'';
const dt=s=>s?new Date(s).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'}):'';
const bytes=d=>d.versions.reduce((a,v)=>a+v.size,0);
const docsOf=p=>Object.values(db.docs).filter(d=>!p||d.project===p);
const pname=id=>db.projects[id]?db.projects[id].name:'';
const dl=(d,n)=>'/api/download?project='+d.project+'&name='+encodeURIComponent(d.name)+'&rev='+n;
const opts=all=>(all?'<option value="">Tất cả dự án</option>':'')+Object.values(db.projects).map(p=>'<option value="'+p.id+'"'+(p.id===proj?' selected':'')+'>'+esc(p.name)+'</option>').join('');
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2400)}

async function load(force){
 try{const j=JSON.parse(await(await fetch('/api/data')).text());free=j.free==null?null:j.free;const fe=$('free');if(fe&&free!=null)fe.textContent=sz(free);
  const sig=JSON.stringify([j.db,j.quota]);if(!force&&sig===last)return;last=sig;
  db=j.db;quota=j.quota||0;dir=j.dir;render()}
 catch(e){toast('Không kết nối được máy chủ. Kiểm tra cửa sổ đang chạy node server.js')}
}
async function api(b){
 const r=await fetch('/api/act',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});
 if(!r.ok){toast((await r.json()).error||'Có lỗi xảy ra');return false}
 await load(true);return true;
}

function render(){
 const co=db.settings.company||'Công ty của bạn';
 $('co').textContent=co;$('lg').textContent=co.trim().charAt(0).toUpperCase()||'C';document.title=co+' – CDE';
 $('nav').innerHTML=NAV.map(n=>'<button class="nv" data-a="go" data-v="'+n[0]+'" aria-current="'+(view===n[0])+'"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+n[2]+'</svg>'+n[1]+'</button>').join('');
 if(proj&&!db.projects[proj])proj='';
 if(view==='data'&&!proj)proj=Object.keys(db.projects)[0]||'';
 $('main').innerHTML=({home:vhome,projects:vprojects,data:vdata,settings:vsettings})[view]();
 if(view==='data'&&proj&&ptab==='files')tbl();
}

function vhome(){
 const all=docsOf(''),used=all.reduce((a,d)=>a+bytes(d),0),cap=quota*1073741824,pct=quota?Math.min(100,used/cap*100):0;
 const open=db.tasks.filter(t=>!t.done&&(!proj||t.project===proj)),appr=docsOf(proj).filter(d=>d.state==='shared');
 const size={};all.forEach(d=>size[d.project]=(size[d.project]||0)+bytes(d));
 const top=Object.values(db.projects).sort((a,b)=>(size[b.id]||0)-(size[a.id]||0)).slice(0,5),max=Math.max(1,...top.map(p=>size[p.id]||0));
 const lg=db.log.filter(l=>!proj||l.p===proj).slice(0,6);
 return '<div class="hd"><div><h1>Bảng điều khiển</h1><div class="mut">Chào mừng đến với kho dữ liệu của '+esc(db.settings.company||'công ty bạn')+'</div></div><select data-a="proj" aria-label="Dự án">'+opts(true)+'</select></div>'+
 '<h2 class="sec">Thông tin chung</h2><div class="g3">'+
 '<div class="card"><h3>Tổng dung lượng lưu trữ</h3>'+(quota?'<div class="big">'+(pct<10?pct.toFixed(1):Math.round(pct))+'%</div><div class="meter"><i style="width:'+(used&&pct<1?1:pct)+'%"></i></div>':'<div class="big">Không giới hạn</div><div class="mut" style="margin:4px 0 12px">Tải lên bao nhiêu tệp tùy ý</div>')+
  '<div class="kv"><span><span class="mut">Đã sử dụng</span><br><b>'+sz(used)+'</b></span></b></span>'+(quota?'<span style="text-align:right"><span class="mut">Còn lại</span><br><b>'+sz(Math.max(0,cap-used))+'</b></span>':free!=null?'<span style="text-align:right"><span class="mut">Ổ đĩa còn trống</span><br><b id="free">'+sz(free)+'</b></span>':'')+'</div></div>'+
 '<div class="card"><div class="kv"><h3>Nhiệm vụ</h3><span class="mut">Còn '+open.length+' việc</span></div><ul class="ls">'+
  (open.slice(0,5).map(t=>'<li><button class="chk" data-a="toggle" data-id="'+t.id+'" aria-label="Đánh dấu hoàn thành"></button><span>'+esc(t.title)+(t.project?'<br><small class="mut">'+esc(pname(t.project))+'</small>':'')+'</span></li>').join('')||'<li class="mut">Chưa có nhiệm vụ nào.</li>')+
  '</ul><form class="add" data-f="task"><input name="title" required maxlength="120" placeholder="Thêm nhiệm vụ mới" aria-label="Nhiệm vụ mới"><button class="btn pri">Thêm</button></form></div>'+
 '<div class="card"><div class="kv"><h3>Phê duyệt</h3><span class="mut">Chờ duyệt: '+appr.length+'</span></div><ul class="ls">'+

function foldersOf(pid){                                 // mọi thư mục của dự án (gồm cả thư mục cha), nhớ tạm cho tới lần tải dữ liệu sau
 const C=fc();if(C.f[pid])return C.f[pid];
 const set=new Set(),add=p=>{const a=p.split('/');for(let i=1;i<=a.length;i++)set.add(a.slice(0,i).join('/'))};
 docsOf(pid).forEach(d=>{const i=d.name.lastIndexOf('/');if(i>0)add(d.name.slice(0,i))});
 (db.folders||[]).forEach(f=>{if(f.startsWith(pid+'/'))add(f.slice(pid.length+1))});
 const kids={};set.forEach(p=>{const i=p.lastIndexOf('/'),par=i<0?'':p.slice(0,i);(kids[par]=kids[par]||[]).push(p.slice(i+1))});
 return C.f[pid]={set,kids,slugs:{}};
}
function slugMap(pid,parent){                            // tên thư mục con -> đoạn đường dẫn, không trùng nhau trong cùng thư mục cha
 const F=foldersOf(pid);if(F.slugs[parent])return F.slugs[parent];
 const names=F.kids[parent]||[],cnt={},m=new Map();
 names.forEach(n=>{const s=slug(n);cnt[s]=(cnt[s]||0)+1});
 names.forEach(n=>{const s=slug(n);m.set(n,s&&cnt[s]===1?s:(s||'thu-muc')+'-'+tiny(n))});
 return F.slugs[parent]=m;
}
function pslug(pid){

}

 (path?path.split('/'):[]).forEach(seg=>{o.push(slugMap(pid,cur).get(seg)||slug(seg)||'thu-muc-'+tiny(seg));cur=cur?cur+'/'+seg:seg});
 return '/'+o.join('/');
}
function resolve(pid,segs){                              // đoạn đường dẫn -> thư mục thật; dừng ở thư mục sâu nhất tìm thấy

 for(const sg of segs){let hit=null;for(const [n,s] of slugMap(pid,cur))if(s===sg||n===sg){hit=n;break}if(hit===null)break;cur=cur?cur+'/'+hit:hit}
 return cur;
}

async function upload(items,dir){
 if(!items.length||busy)return;if(!proj){toast('Chọn dự án trước khi tải lên');return}
 const base=dir==null?cwd:dir;items.forEach(i=>i.name=(base?base+'/':'')+i.name);busy=true;const pid=proj,total=items.reduce((a,i)=>a+i.f.size,0)||1;let done=0,ok=0;

  try{await put(items[i],pid,l=>prog(Math.round((done+l)/total*100),'Đang tải '+(i+1)+'/'+items.length+' · '+items[i].name));done+=items[i].f.size;ok++}
  catch(e){toast('Lỗi khi tải '+items[i].name+': '+e.message);break}

async function walk(en,pre,out){

  for(const e of all)await walk(e,pre+en.name+'/',out)}
}

 else if(c==='copy')copy(fileLink(d));
 else if(c==='flag'){if(flags.has(t.key))flags.delete(t.key);else flags.add(t.key);saveFlags();tbl()}
 else if(c==='lock'){if(await api({type:'lock',key:t.key}))toast(db.docs[t.key]&&db.docs[t.key].locked?'Đã khóa tệp':'Đã mở khóa tệp')}
 else if(c.startsWith('st:')){const s=c.slice(3);if(await api({type:'state',key:t.key,state:s}))toast(DONE[s])}
 else if(c==='ren'){
  const dot=b.lastIndexOf('.'),n=await ask({title:'Đổi tên tệp',input:1,value:b,sel:dot>0?dot:b.length,ok:'Đổi tên'}),nn=n&&n.replace(/[\\/]+/g,'-').trim();
  if(nn&&nn!==b){const to=(parentOf(name)?parentOf(name)+'/':'')+nn;
   if(await api({type:'rename',project:pid,from:name,to,folder:false})){remap(t.key,pid+'/'+to);tbl();toast('Đã đổi tên tệp')}}
 }else if(c==='del'){
  if(await ask({title:'Xóa tệp “'+b+'”?',text:'Sẽ xóa vĩnh viễn tệp cùng toàn bộ '+d.versions.length+' phiên bản. Không thể hoàn tác.',ok:'Xóa tệp',danger:1})&&await api({type:'deldoc',keys:[t.key]})){
   sel.delete(t.key);flags.delete(t.key);saveFlags();toast('Đã xóa tệp')}
 }
}
document.addEventListener('contextmenu',e=>{
 if(e.target.closest('input,select,textarea,dialog'))return;                 // giữ menu mặc định của trình duyệt cho ô nhập
 const el=e.target.closest('[data-ctx]');if(!el)return;
 e.preventDefault();showCtx(el,e.clientX,e.clientY);
});
document.addEventListener('keydown',e=>{
 if(!ctxEl.classList.contains('on'))return;
 if(e.key==='Escape'){hideCtx();return}
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const bs=[...ctxEl.querySelectorAll('button')],i=bs.indexOf(document.activeElement);bs[(i+(e.key==='ArrowDown'?1:-1)+bs.length)%bs.length].focus()}
});
window.addEventListener('scroll',hideCtx,true);window.addEventListener('resize',hideCtx);
load(true).then(route);
setInterval(()=>{if(!busy&&!/INPUT|SELECT/.test(document.activeElement.tagName))load()},10000); // tự cập nhật khi có thay đổi
</script>
</body>
